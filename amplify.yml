version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use
        - corepack enable
    build:
      commands:
        - yarn install --immutable
        - yarn eslint src
        - yarn build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .yarn/cache/**/*
      - node_modules/**/*
      - public/images/**/*
