version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 25.9.0
        - nvm use 25.9.0
        # Install missing system library for Node 25 on Amazon Linux
        - yum update -y || true
        - yum install -y libatomic || true
        # Enable Corepack to get Yarn 4.x
        - corepack enable
    build:
      commands:
        - yarn install
        - yarn eslint src
        - yarn build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - public/images/**/*
