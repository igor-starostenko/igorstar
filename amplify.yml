version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
    build:
      commands:
        - yarn install
        - yarn eslint src
        - yarn build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - public/images/**/*
