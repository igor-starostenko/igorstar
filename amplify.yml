version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 25.9.0
        - nvm use 25.9.0
        - node -v
        - npm -v
        - npm install -g corepack@latest
        - corepack enable
        - corepack prepare yarn@4.15.0 --activate
        - yarn -v
    build:
      commands:
        - yarn install --immutable
        - yarn eslint src
        - yarn build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .yarn/cache/**/*
      - node_modules/**/*
      - public/images/**/*
