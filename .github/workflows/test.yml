name: Tests

on:
  push:
    branches:
      - v2.5.0d
      - v2.5.0
    paths:
      - '**/*.js'
      - '**/*.jsx'
  pull_request:
    branches:
      - v2.5.0
    paths:
      - '**/*.js'
      - '**/*.jsx'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Run tests
        run: yarn test
