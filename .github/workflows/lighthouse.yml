name: Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit (default: https://igorstar.com)'
        required: false
        default: 'https://igorstar.com'
      thresholds:
        description: 'Performance threshold (0-1, default: 0.9)'
        required: false
        default: '0.9'

jobs:
  lighthouse-audit:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable

      - name: Run Lighthouse test against production
        env:
          SITE_URL: https://igorstar.com
          THRESHOLD: ${{ github.event.inputs.thresholds || '0.9' }}
        run: npm run test:lighthouse

      - name: Upload Lighthouse Report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            *.json
          retention-days: 7
